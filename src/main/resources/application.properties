spring.application.name=biblioteca-api 


spring.profiles.active=dev


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:sin_configurar}
cloudinary.api-key=${CLOUDINARY_API_KEY:sin_configurar}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:sin_configurar}